name: sylvara_frontend
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.2
  google_sign_in: ^6.2.2
  path_provider: ^2.1.5
  fl_chart: ^0.68.0
  image_picker: ^1.2.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/backgrounds/
    - assets/images/logos/
  # TODO: Agregar fuentes Montserrat
  # fonts:
  #   - family: Montserrat
  #     fonts:
  #       - asset: fonts/Montserrat-Regular.ttf
  #         weight: 400
  #       - asset: fonts/Montserrat-SemiBold.ttf
  #         weight: 600
  #       - asset: fonts/Montserrat-Bold.ttf
  #         weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logos/sylvara_logo_2.png"
  web:
    generate: true
    image_path: "assets/images/logos/sylvara_logo_2.png"
    background_color: "#FFFFFF"
    theme_color: "#0E3520"
  windows:
    generate: true
    image_path: "assets/images/logos/sylvara_logo_2.png"